<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Setup | FolioOne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body class="admin-login-page">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1>Create Admin</h1>
            <p class="login-subtitle">Create your administrator account</p>
            <form id="setup-form">
                <div class="login-input">
                    <i class="bi bi-person"></i>
                    <input type="text" id="setup-username" placeholder="Username" required />
                </div>
                <div class="login-input">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="setup-email" placeholder="Email address" required />
                </div>
                <div class="login-input">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="setup-password" placeholder="Password" required />
                </div>
                <div class="login-input">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" id="setup-confirm-password" placeholder="Confirm password" required />
                </div>
                <div id="setup-error" class="login-error"></div>
                <button type="submit" class="login-button">
                    <span>Create Admin Account</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
    <script src="/admin/assets/admin.js"></script>
</body>
</html>
